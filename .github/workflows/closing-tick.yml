# Runs one cycle of the follow-up engine on staging. Production is ticked by
# the Vercel cron in app/vercel.json (every 5 min, Pro plan), which only runs on
# production deployments. GitHub only fires this schedule every few hours, which
# is enough for staging.
# Repository secrets: STAGING_APP_URL + STAGING_CRON_SECRET (same values as on
# Vercel). The job is skipped when they are missing.
# Scheduled runs use the workflow file of the default branch (main).
name: Closing engine tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: closing-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one engine cycle
        env:
          APP_URL: ${{ secrets.STAGING_APP_URL }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::staging secrets are missing, skipping"
            exit 0
          fi
          # The route may run up to 300 s (page reading and deal analyses call an LLM)
          curl --fail-with-body -sS --max-time 310 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/closing"
