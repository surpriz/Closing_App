# Runs one cycle of the follow-up engine every 5 minutes (anti-ghosting scan,
# sending due follow-ups, deal analyses) on production and staging. Vercel Hobby
# only allows daily crons, hence GitHub.
# Repository secrets: APP_URL + CRON_SECRET for production, STAGING_APP_URL +
# STAGING_CRON_SECRET for staging (same values as on Vercel). A target whose
# secrets are missing is skipped.
# Scheduled runs use the workflow file of the default branch (main).
name: Closing engine tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: closing-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        target: [production, staging]
    steps:
      - name: Run one engine cycle
        env:
          APP_URL: ${{ matrix.target == 'production' && secrets.APP_URL || secrets.STAGING_APP_URL }}
          CRON_SECRET: ${{ matrix.target == 'production' && secrets.CRON_SECRET || secrets.STAGING_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::secrets for ${{ matrix.target }} are missing, skipping"
            exit 0
          fi
          # The route may run up to 300 s (page reading and deal analyses call an LLM)
          curl --fail-with-body -sS --max-time 310 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/closing"
