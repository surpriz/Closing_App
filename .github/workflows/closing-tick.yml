# Runs one cycle of the follow-up engine every 5 minutes (anti-ghosting scan and
# sending due follow-ups). Vercel Hobby only allows daily crons, hence GitHub.
# Needs repository secrets APP_URL (e.g. https://app.clozer.club) and CRON_SECRET
# (same value as on Vercel).
name: Closing engine tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: closing-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one engine cycle
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL or CRON_SECRET secret is missing, skipping"
            exit 0
          fi
          curl --fail-with-body -sS --max-time 150 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/closing"
