# Security fixes come in as soon as they are published; routine bumps once a week, grouped
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/app", "/landing", "/extension", "/outlook"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: staging
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: staging
